<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kernel Teachings of the Buddha</title>
    <style>
      html:not(.fonts-loaded) body {
        opacity: 0 !important;
        visibility: hidden !important;
      }
      html.fonts-loaded body {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.2s ease-in;
      }
    </style>
    <script>
      (function(){
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme:dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
        document.documentElement.classList.add('no-transition');

        function markFontsLoaded() {
          document.documentElement.classList.add('fonts-loaded');
        }

        if ('fonts' in document) {
          Promise.all([
            document.fonts.load('1em "Karla"', 'ĀāĪīŪūÑñṀṁ'),
            document.fonts.load('1em "Cormorant Garamond"', 'ĀāĪīŪūÑñṀṁ'),
            document.fonts.load('1em "Inter"', 'ĀāĪīŪūÑñṀṁ')
          ]).then(markFontsLoaded).catch(markFontsLoaded);
          setTimeout(markFontsLoaded, 2000);
        } else {
          markFontsLoaded();
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-D_SoY8vK.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-yYqFqHXG.css">

  </body>
</html>
